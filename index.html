<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#F4F2EE" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>One Driver</title>
    <style>
      /* Écran de chargement : même fond et même logo que l'écran de lancement de l'iPhone */
      #boot-splash{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:#F4F2EE;transition:opacity .35s ease}
      #boot-splash img{width:min(71vw,320px);height:auto;transform-origin:50% 51.2%;animation:boot-spin 1.5s cubic-bezier(.65,0,.35,1) infinite}
      #boot-splash .logo-dark{display:none}
      @media (prefers-color-scheme: dark){#boot-splash{background:#0C0D0E}#boot-splash .logo-light{display:none}#boot-splash .logo-dark{display:block}}
      :root[data-theme="light"] #boot-splash{background:#F4F2EE}
      :root[data-theme="light"] #boot-splash .logo-light{display:block}
      :root[data-theme="light"] #boot-splash .logo-dark{display:none}
      :root[data-theme="dark"] #boot-splash{background:#0C0D0E}
      :root[data-theme="dark"] #boot-splash .logo-light{display:none}
      :root[data-theme="dark"] #boot-splash .logo-dark{display:block}
      #boot-splash.hide{opacity:0;pointer-events:none}
      @keyframes boot-spin{to{transform:rotate(360deg)}}
      @media (prefers-reduced-motion: reduce){#boot-splash img{animation-duration:4s}}
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <img class="logo-light" src="/logo.svg" alt="" />
      <img class="logo-dark" src="/logo-dark.svg" alt="" />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
